        rate:
          type: number
          description: Multiply an amount in sourceCurrency by this rate to get the equivalent in targetCurrency
          example: 0.9256
        date:
          type: string
          format: date
          description: Date the rate applies to
          example: '2024-03-15'
    DocumentComplianceStatus:
      $ref: ./schemas/document/DocumentComplianceStatus.yaml
    DocumentComplianceStatusOverride:
      $ref: ./schemas/document/DocumentComplianceStatusOverride.yaml
    DocumentComplianceStatusOverrideRequest:
      $ref: ./schemas/document/DocumentComplianceStatusOverrideRequest.yaml
    DocumentTypeOverrideRequest:
      $ref: ./schemas/document/DocumentTypeOverrideRequest.yaml
    DocumentPipelineEvent:
      $ref: ./schemas/document/DocumentPipelineEvent.yaml
    Document:
      type: object
      description: A document record with its processing state and extracted data
      required:
        - id
        - organisationId
        - status
        - files
        - createdBy
        - createTime
        - updateTime
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the document
          example: d52a7115-452e-493b-9f44-744734622c73
        organisationId:
          type: string
          format: uuid
          description: Moss identifier of the parent organisation
          example: d52a7115-452e-493b-9f44-744734622c73
        status:
          $ref: '#/components/schemas/DocumentStatus'
        type:
          $ref: '#/components/schemas/DocumentType'
        category:
          $ref: '#/components/schemas/DocumentCategory'
        channel:
          $ref: '#/components/schemas/DocumentChannel'
        extractedDocumentTime:
          type: string
          format: date-time
          description: Date and time extracted from the document content
          example: '2024-03-15T00:00:00Z'
        amount:
          type: number
          description: Monetary amount extracted from the document
          example: 1250
        counterpartyId:
          type: string
          format: uuid
          description: UUID of the associated counterparty (supplier/vendor)
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        confidence:
          $ref: '#/components/schemas/DocumentConfidenceLevel'
        files:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DocumentFile'
          description: Files attached to this document
        duplicates:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of documents detected as duplicates of this one
        duplicateStatus:
          $ref: '#/components/schemas/DocumentDuplicateStatus'
        extractedFields:
          type: array
          items:
            $ref: '#/components/schemas/DocumentExtractedField'
          description: Fields extracted from the document during processing
        documentLines:
          type: array
          items:
            $ref: '#/components/schemas/DocumentLine'
          description: Line items extracted from the document, ordered by positionIndex
        links:
          type: array
          items:
            $ref: '#/components/schemas/DocumentLink'
        pipelineEvents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentPipelineEvent'
          description: Log of events recorded as the document moved through the processing pipeline
        complianceCheck:
          $ref: '#/components/schemas/DocumentComplianceCheckOverallResult'
        complianceStatusOverride:
          $ref: '#/components/schemas/DocumentComplianceStatusOverride'
        complianceStatus:
          $ref: '#/components/schemas/DocumentComplianceStatus'
        createdBy:
          $ref: '#/components/schemas/DocumentActor'
        createTime:
          type: string
          format: date-time
          description: Timestamp when the document was created
          example: '2024-03-15T10:30:00Z'
        updateTime:
          type: string
          format: date-time
          description: Timestamp when the document was last updated
          example: '2024-03-15T11:00:00Z'
    DocumentLine:
      type: object
      description: A line item extracted from a document
      required:
        - id
        - lineSource
        - grossAmount
        - currency
        - positionIndex
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the document line
          example: 123e4567-e89b-12d3-a456-426614174000
        extractedLineId:
          type: string
          format: uuid
          description: Identifier of the source line produced during extraction
          example: 223e4567-e89b-12d3-a456-426614174001
        fileId:
          type: string
          format: uuid
          description: Identifier of the document file from which the line was extracted
          example: 323e4567-e89b-12d3-a456-426614174002
        entityLineId:
          type: string
          format: uuid
          description: Identifier of the expense line linked to this document line
          example: 423e4567-e89b-12d3-a456-426614174003
        lineSource:
          $ref: '#/components/schemas/DocumentLineSource'
        bookingTextFieldId:
          type: string
          format: uuid
          description: Identifier of the extracted field supplying the booking text
          example: 523e4567-e89b-12d3-a456-426614174004
        bookingText:
          type: string
          description: Booking text for the line
          example: Office supplies
        bookingTextFieldSource:
          anyOf:
            - $ref: '#/components/schemas/DocumentLineFieldSource'
            - type: 'null'
        grossAmountFieldId:
          type: string
          format: uuid
          description: Identifier of the extracted field supplying the gross amount
          example: 623e4567-e89b-12d3-a456-426614174005
        grossAmount:
          type: number
          format: double
          description: Gross line amount in the line currency
          example: 119
        grossAmountFieldSource:
          anyOf:
            - $ref: '#/components/schemas/DocumentLineFieldSource'
            - type: 'null'
        netAmountFieldId:
          type: string
          format: uuid
          description: Identifier of the extracted field supplying the net amount
          example: 723e4567-e89b-12d3-a456-426614174006
        netAmount:
          type: number
          format: double
          description: Net line amount in the line currency
          example: 100
        netAmountFieldSource:
          anyOf:
            - $ref: '#/components/schemas/DocumentLineFieldSource'
            - type: 'null'
        currencyFieldId:
          type: string
          format: uuid
          description: Identifier of the extracted field supplying the currency
          example: 823e4567-e89b-12d3-a456-426614174007
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code used by the line amounts
          example: EUR
        currencyFieldSource:
          anyOf:
            - $ref: '#/components/schemas/DocumentLineFieldSource'
            - type: 'null'
        generalLedgerAccountFieldId:
          type: string
          format: uuid
          description: Identifier of the extracted field supplying the general ledger account
          example: 923e4567-e89b-12d3-a456-426614174008
        generalLedgerAccount:
          type: string
          format: uuid
          description: Identifier of the general ledger account assigned to the line
          example: a23e4567-e89b-12d3-a456-426614174009
        generalLedgerAccountFieldSource:
          anyOf:
            - $ref: '#/components/schemas/DocumentLineFieldSource'
            - type: 'null'
        generalLedgerAccountConfidence:
          $ref: '#/components/schemas/DocumentConfidenceLevel'
        vatFieldId:
          type: string
          format: uuid
          description: Identifier of the extracted field supplying the tax rate
          example: b23e4567-e89b-12d3-a456-42661417400a
        vat:
          type: string
          format: uuid
          description: Tax-rate identifier resolvable through GET /v1/tax-rates using the id query parameter
          example: e852fc73-1f4b-4ce7-937f-ac5ee2231ddc
        vatFieldSource:
          anyOf:
            - $ref: '#/components/schemas/DocumentLineFieldSource'
            - type: 'null'
        vatConfidence:
          $ref: '#/components/schemas/DocumentConfidenceLevel'
        quantity:
          type: number
          format: double
          description: Quantity represented by the line
          example: 1
        unitPrice:
          type: number
          format: double
          description: Price per unit in the line currency
          example: 100
        vatAmount:
          type: number
          format: double
          description: VAT amount in the line currency
          example: 19
        positionIndex:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based position of the line within the document
          example: 0
        extractionConfidence:
          $ref: '#/components/schemas/DocumentConfidenceLevel'
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/DocumentLineDimension'
          description: Accounting dimensions assigned to the line
    DocumentLineDimension:
      type: object
      description: An accounting dimension assigned to a document line
      required:
        - id
        - dimensionId
        - dimensionItemId
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the document-line dimension assignment
          example: c23e4567-e89b-12d3-a456-42661417400b
        fieldId:
          type: string
          format: uuid
          description: Identifier of the extracted field supplying the dimension
          example: d23e4567-e89b-12d3-a456-42661417400c
        dimensionId:
          type: string
          format: uuid
          description: Identifier of the accounting dimension
          example: 00000000-0000-0000-0000-000000000001
        dimensionName:
          type: string
          description: Name of the accounting dimension
          example: Cost center
        dimensionItemId:
          type: string
          format: uuid
          description: Identifier of the selected dimension item
          example: e23e4567-e89b-12d3-a456-42661417400d
        dimensionItemName:
          type: string
          description: Name of the selected dimension item
          example: Engineering
        dimensionItemValue:
          type: string
          description: Value of the selected dimension item
          example: CC-100
        fieldSource:
          type: string
          description: Origin of the value assigned to the dimension
          example: AUTOMATION
    DocumentLineSource:
      type: string
      description: Origin of the document line
      enum:
        - OCR
        - USER
        - UNKNOWN_DEFAULT_OPEN_API
      default: UNKNOWN_DEFAULT_OPEN_API
      example: OCR
    DocumentLineFieldSource:
      type: string
      description: Origin of a value assigned to a document line field
      enum:
        - MANUAL
        - OCR
        - OCR_LOW_CONFIDENCE
        - AUTOMATION
        - AUTOMATION_LOW_CONFIDENCE
        - DEFAULT_MERCHANT_RULE
        - SUBSCRIPTION_CARD
        - SUPPLIER_DEFINITION
        - DEFAULT_REIMBURSEMENT_RULE
        - UNKNOWN_DEFAULT_OPEN_API
      default: UNKNOWN_DEFAULT_OPEN_API
      example: OCR
    DocumentStatus:
      type: string
      description: Processing status of the document
      enum:
        - CREATED
        - VALIDATED
        - CLASSIFIED
        - FIELDS_EXTRACTED
        - LINES_EXTRACTED
        - COMPLIANCE_CHECKED
        - DUPLICATE_CHECKED
        - CONFIDENCE_SCORED
        - LINKED
        - FAILED
        - DELETED
        - COMPLETED
        - UNKNOWN_DEFAULT_OPEN_API
      default: UNKNOWN_DEFAULT_OPEN_API
      example: LINKED
    DocumentChannel:
      type: string
      description: Channel through which the document was received
      enum:
        - INBOX
        - WEB_USER
        - UNKNOWN_DEFAULT_OPEN_API
      default: UNKNOWN_DEFAULT_OPEN_API
      example: INBOX
    DocumentFile:
      type: object
      description: A file attached to a document
      required:
        - id
        - name
        - originalName
        - sizeBytes
        - type
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the file
          example: f1e2d3c4-b5a6-7890-abcd-ef1234567890
        name:
          type: string
          description: Stored file name
          example: invoice_2024_03.pdf
        originalName:
          type: string
          description: Original file name as uploaded
          example: Invoice March 2024.pdf
        sizeBytes:
          type: integer
          format: int64
          description: File size in bytes
          example: 204800
        type:
          type: string
          description: MIME type of the file
          example: application/pdf
    DocumentFieldCandidate:
      type: object
      required:
        - value
        - sourceTag
        - confidence
      properties:
        value:
          $ref: '#/components/schemas/DocumentFieldValue'
        sourceTag:
          $ref: '#/components/schemas/DocumentFieldSourceTag'
        confidence:
          $ref: '#/components/schemas/DocumentConfidenceLevel'
    DocumentFieldValueType:
      type: string
      enum:
        - ADDRESS
        - BOOLEAN
        - CURRENCY_CODE
        - DATE
        - NUMBER
        - PAYMENT_TERM
        - TEXT
        - UUID
        - VAT_DATA
        - UNKNOWN_DEFAULT_OPEN_API
      default: UNKNOWN_DEFAULT_OPEN_API
      example: TEXT
    DocumentFieldValue:
      type: object
      description: A typed document field value.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/DocumentFieldValueType'
      discriminator:
        propertyName: type
        mapping:
          ADDRESS: '#/components/schemas/DocumentFieldValueAddress'
          BOOLEAN: '#/components/schemas/DocumentFieldValueBoolean'
          CURRENCY_CODE: '#/components/schemas/DocumentFieldValueCurrencyCode'
          DATE: '#/components/schemas/DocumentFieldValueDate'
          NUMBER: '#/components/schemas/DocumentFieldValueNumber'
          PAYMENT_TERM: '#/components/schemas/DocumentFieldValuePaymentTerm'
          TEXT: '#/components/schemas/DocumentFieldValueText'
          UUID: '#/components/schemas/DocumentFieldValueUuid'
          VAT_DATA: '#/components/schemas/DocumentFieldValueVatData'
      oneOf:
        - $ref: '#/components/schemas/DocumentFieldValueAddress'
        - $ref: '#/components/schemas/DocumentFieldValueBoolean'
        - $ref: '#/components/schemas/DocumentFieldValueCurrencyCode'
        - $ref: '#/components/schemas/DocumentFieldValueDate'
        - $ref: '#/components/schemas/DocumentFieldValueNumber'
        - $ref: '#/components/schemas/DocumentFieldValuePaymentTerm'
        - $ref: '#/components/schemas/DocumentFieldValueText'
        - $ref: '#/components/schemas/DocumentFieldValueUuid'
        - $ref: '#/components/schemas/DocumentFieldValueVatData'
    DocumentFieldValueAddress:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/DocumentFieldValueType'
        value:
          $ref: '#/components/schemas/Address'
    DocumentFieldValueBoolean:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/DocumentFieldValueType'
        value:
          type: boolean
    DocumentFieldValueCurrencyCode:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/DocumentFieldValueType'
        value:
          type: string
          format: iso-4217
          description: ISO 4217 currency code
          example: EUR
    DocumentFieldValueDate:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/DocumentFieldValueType'
        value:
          type: string
          format: date
    DocumentFieldValueNumber:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/DocumentFieldValueType'
        value:
          type: string
          format: decimal
    DocumentFieldValuePaymentTerm:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/DocumentFieldValueType'
        value:
          type: object
          properties:
            discountPercentage:
              type: string
              format: decimal
            discountDate:
              type: string
              format: date
            discountDays:
              type: integer
    DocumentFieldValueText:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/DocumentFieldValueType'
        value:
          type: string
    DocumentFieldValueUuid:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/DocumentFieldValueType'
        value:
          type: string
          format: uuid
    DocumentFieldValueVatData:
      type: object
      required:
        - type
        - value
      properties:
        type:
          $ref: '#/components/schemas/DocumentFieldValueType'
        value:
          type: object
          properties:
            itemAmount:
              type: string
              format: decimal
            taxAmount:
              type: string
              format: decimal
            totalAmount:
              type: string
              format: decimal
            percentage:
              type: string
              format: decimal
    DocumentFieldSourceTag:
      type: string
      description: |
        Indicates how a document field candidate's value was derived.
        - SELECTED: If present, indicates this field option is currently selected.
        - AUTOMATIC: Automatic extraction. Mutually exclusive with AUTOMATIC_LOW_CONFIDENCE and MANUAL.
        - AUTOMATIC_LOW_CONFIDENCE: Automatic extraction with low confidence. Mutually exclusive with AUTOMATIC and MANUAL.
        - MANUAL: Manual entry. Mutually exclusive with AUTOMATIC and AUTOMATIC_LOW_CONFIDENCE.
        - SUPPLIER_DEFINITION: The field was set by supplier automation.
        - SUPPLIER_MATCH_BY_*: For supplier field options only, indicates which supplier attribute the value
          was matched against (email, website, IBAN, account number, domestic account number, VAT ID,
          fingerprint, an intersection of attributes, name, smart prediction, a learned address, a learned
          name, a defined address, a defined name, or a defined email). Mutually exclusive with each other.
        - UNKNOWN: Source is unknown.
      enum:
        - SELECTED
        - AUTOMATIC
        - AUTOMATIC_LOW_CONFIDENCE
        - MANUAL
        - SUPPLIER_DEFINITION
        - SUPPLIER_MATCH_BY_EMAIL
        - SUPPLIER_MATCH_BY_WEBSITE
        - SUPPLIER_MATCH_BY_IBAN
        - SUPPLIER_MATCH_BY_ACCOUNT_NUMBER
        - SUPPLIER_MATCH_BY_DOMESTIC_ACCOUNT_NUMBER
        - SUPPLIER_MATCH_BY_VAT
        - SUPPLIER_MATCH_BY_FINGERPRINT
        - SUPPLIER_MATCH_BY_INTERSECTION
        - SUPPLIER_MATCH_BY_NAME
        - SUPPLIER_MATCH_BY_SMART_PREDICTION
        - SUPPLIER_MATCH_BY_LEARNED_ADDRESS
        - SUPPLIER_MATCH_BY_LEARNED_NAME
        - SUPPLIER_MATCH_BY_DEFINED_ADDRESS
        - SUPPLIER_MATCH_BY_DEFINED_NAME
        - SUPPLIER_MATCH_BY_DEFINED_EMAIL
        - UNKNOWN
        - UNKNOWN_DEFAULT_OPEN_API
      default: UNKNOWN_DEFAULT_OPEN_API
      example: AUTOMATIC
    DocumentExtractedField:
      type: object
      description: A field extracted from the document during processing
      required:
        - id
        - fieldType
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the extracted field
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        fieldType:
          $ref: '#/components/schemas/DocumentFieldType'
        fieldId:
          type: string
          format: uuid
          description: UUID reference to the linked dimension/entity
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
        extractedLineId:
          type: string
          format: uuid
          description: UUID of the extracted invoice line this field belongs to
          example: d4e5f6a7-b8c9-0123-defa-234567890123
        fileId:
          type: string
          format: uuid
          description: UUID of the file this field was extracted from
          example: e5f6a7b8-c9d0-1234-efab-345678901234
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/DocumentFieldCandidate'
        boundingBox:
          type: object
          description: Location of the field within the document page
          properties:
            top:
              type: number
              format: double
              description: Top position as a fraction of page height
            left:
              type: number
              format: double
              description: Left position as a fraction of page width
            page:
              type: integer
              description: Page number (1-based) where the field was found
            width:
              type: number
              format: double
              description: Width as a fraction of page width
            height:
              type: number
              format: double
              description: Height as a fraction of page height
    DocumentFieldType:
      type: string
      description: |
        Type of field extracted from the document.
        TOTAL_NET_AMOUNT is the explicitly stated document total excluding VAT.
        TOTAL_GROSS_AMOUNT is the explicitly stated document total including VAT, before payments are deducted.
        TOTAL_VAT_AMOUNT is the explicitly stated total VAT amount for the document.
        REVERSE_CHARGE_TEXT is wording stating that reverse charge applies to the document, in its original language.
        BUYER_VAT_ID is the buyer's VAT ID as printed on the document.
      enum:
        - SUPPLIER_ACCOUNT
        - EXPENSE_ACCOUNT
        - CATEGORY
        - VAT
        - VAT_AMOUNT_OVERRIDE
        - BOOKING_TEXT
        - DESCRIPTION
        - INVOICE_NUMBER
        - COST_CENTER
        - COST_CARRIER
        - DIMENSION
        - STATUS
        - EXPENSE_DATE
        - GROSS_AMOUNT
        - CURRENCY
        - CARD_LAST_FOUR_DIGITS
        - TEAM
        - PAYMENT_TERM
        - PAYMENT_REFERENCE
        - PAYMENT_STATUS
        - SPLIT
        - SUB_INVOICES
        - DUE_DATE
        - DELIVERY_DATE
        - QUANTITY
        - HOSPITALITY_ENABLED
        - INTERNAL_PARTICIPANTS
        - EXTERNAL_PARTICIPANTS
        - TIP
        - HOSPITALITY_PURPOSE
        - HOSPITALITY_RESTAURANT_NAME
        - HOSPITALITY_ADDRESS_TEXT
        - DELIVERY_DATE_OR_SERVICE_PERIOD
        - RECEIPT_REQUIREMENT
        - NET_AMOUNT
        - VAT_AMOUNT
        - VERIFIER
        - SUPPLIER_NAME
        - SUPPLIER_VAT_ID
        - SUPPLIER_TAX_NUMBER
        - SUPPLIER_ADDRESS
        - SUPPLIER_MOSS_ID
        - BUYER_NAME
        - BUYER_ADDRESS
        - DISTANCE
        - TOTAL_NET_AMOUNT
        - TOTAL_GROSS_AMOUNT
        - TOTAL_VAT_AMOUNT
        - REVERSE_CHARGE_TEXT
        - BUYER_VAT_ID
        - UNKNOWN_DEFAULT_OPEN_API
      default: UNKNOWN_DEFAULT_OPEN_API
      example: GROSS_AMOUNT
    DocumentConfidenceLevel:
      type: object
      description: Confidence score for an extraction result
      required:
        - score
      properties:
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Confidence score between 0.0 (no confidence) and 1.0 (full confidence)
          example: 0.95
        comment:
          type: string
          description: Optional explanation of the confidence score
          example: High confidence based on exact text match
    DocumentActor:
      type: object
      description: The actor who performed an action on the document
      required:
        - id
        - type
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the actor
          example: afafb141-9033-49bd-ad2a-c425e6329173
        type:
          $ref: '#/components/schemas/DocumentActorType'
    DocumentActorType:
      type: string
      description: Type of actor that created or modified the document
      enum:
        - USER
        - SYSTEM
        - AGENT
        - UNKNOWN_DEFAULT_OPEN_API
      default: UNKNOWN_DEFAULT_OPEN_API
      example: USER
    DocumentComplianceCheckOverallResult:
      type: object
      description: Aggregate compliance check result for a document.
      required:
        - overallStatus
        - updatedBy
      properties:
        entityCountry:
          type: string
          description: |
            ISO 3166-1 alpha-2 country code of the entity the check was run against.
            Present only when overallStatus is COMPLETED__COMPLIANT, COMPLETED__NOT_COMPLIANT or FAILED__CHECK_FAILED.
          example: DE
        validationType:
          description: Present only when overallStatus is COMPLETED__COMPLIANT, COMPLETED__NOT_COMPLIANT or FAILED__CHECK_FAILED.
          allOf:
            - $ref: '#/components/schemas/DocumentComplianceCheckValidationType'
        overallStatus:
          $ref: '#/components/schemas/DocumentComplianceCheckOverallStatus'
        individualResults:
          type: array
          description: Results of each individual compliance check that was run. Present only when overallStatus is COMPLETED__COMPLIANT, COMPLETED__NOT_COMPLIANT or FAILED__CHECK_FAILED.
          items:
            $ref: '#/components/schemas/DocumentComplianceCheckIndividualResult'
        narrative:
          description: Present only when overallStatus is COMPLETED__NOT_COMPLIANT or FAILED__CHECK_FAILED.
          allOf:
            - $ref: '#/components/schemas/DocumentComplianceCheckNarrative'
        updatedBy:
          $ref: '#/components/schemas/DocumentActor'
    DocumentComplianceCheckValidationType:
      type: string
      description: Depth of compliance validation performed
      enum:
        - FULL
        - SIMPLIFIED
        - UNKNOWN_DEFAULT_OPEN_API
      default: UNKNOWN_DEFAULT_OPEN_API
      example: FULL
    DocumentComplianceCheckOverallStatus:
      type: string
      description: |
        Aggregate compliance outcome for the whole document.
        - NOT_STARTED: Document has been created, but verification hasn't run yet.
        - IN_PROGRESS: Verification is in progress.
        - COMPLETED__COMPLIANT: All checks are COMPLIANT or NOT_APPLICABLE.
        - COMPLETED__NOT_COMPLIANT: One or more checks are NOT_COMPLIANT.
        - FAILED__CHECK_FAILED: No checks are NOT_COMPLIANT, but one or more are CHECK_FAILED.
        - FAILED__GENERIC_ERROR: Compliance check failed.
      enum:
        - NOT_STARTED
        - IN_PROGRESS
        - COMPLETED__COMPLIANT
        - COMPLETED__NOT_COMPLIANT
        - FAILED__CHECK_FAILED
        - FAILED__GENERIC_ERROR
        - UNKNOWN_DEFAULT_OPEN_API
      default: UNKNOWN_DEFAULT_OPEN_API
      example: COMPLETED__COMPLIANT
    DocumentComplianceCheckIndividualResult:
      type: object
      description: Result of a single compliance check.
      required:
        - checkType
        - checkStatus
        - confidenceLevel
      properties:
        checkType:
          $ref: '#/components/schemas/DocumentComplianceCheckIndividualCheckType'
        checkStatus:
          $ref: '#/components/schemas/DocumentComplianceCheckIndividualCheckStatus'
        confidenceLevel:
          $ref: '#/components/schemas/DocumentConfidenceLevel'
        regulationReference:
          $ref: '#/components/schemas/DocumentComplianceCheckIndividualCheckRegulationReference'
        fieldErrors:
          type: array
          description: Field-level errors that caused this check to fail
          items:
            $ref: '#/components/schemas/DocumentComplianceCheckIndividualCheckFieldError'
    DocumentComplianceCheckIndividualCheckType:
      $ref: ./schemas/document/DocumentComplianceCheckIndividualCheckType.yaml
    DocumentComplianceCheckIndividualCheckStatus:
      type: string
      description: |
        Outcome of a single compliance check.
        - COMPLIANT: Check ran and the document satisfies the rule.
        - NOT_COMPLIANT: Check ran and found a violation.
        - NOT_APPLICABLE: Rule doesn't apply to this document (e.g. non-EU supplier, simplified validation).
        - CHECK_FAILED: Check could not reach a verdict — missing prerequisite or unavailable service.
      enum:
        - COMPLIANT
        - NOT_COMPLIANT
        - NOT_APPLICABLE
        - CHECK_FAILED
        - UNKNOWN_DEFAULT_OPEN_API
      default: UNKNOWN_DEFAULT_OPEN_API
      example: COMPLIANT
    DocumentComplianceCheckIndividualCheckRegulationReference:
      type: string
      description: |
        Legal or regulatory basis for a compliance check, scoped by jurisdiction.
        - AT_P10_USTG: Austrian §10 UStG — VAT rate validity.
        - AT_P11_ABS_9_USTG: Austrian §11 Abs. 9 UStG — simplified invoice requirements (≤ €400).
        - AT_P11_USTG: Austrian §11 UStG — full invoice requirements (> €400).
        - AT_P19_USTG: Austrian §19 UStG — domestic reverse charge.
        - DE_P12_USTG: German §12 UStG — VAT rate validity.
        - DE_P13B_USTG: German §13b UStG — reverse charge.
        - DE_P14A_USTG: German §14a UStG — buyer VAT ID required when reverse charge applies.
        - DE_P14_USTG: German §14 UStG — full invoice requirements (> €250).
        - DE_P33_USTDV: German §33 UStDV — simplified invoice requirements (≤ €250).
        - EU_VAT_DIRECTIVE_ART_226: EU VAT Directive 2006/112/EC Art. 226(4) — buyer VAT ID required on invoices where the buyer owes the VAT (EU cross-border reverse charge).
        - EU_VIES: EU VIES (VAT Information Exchange System) — supplier VAT ID exists/name/address match (EU suppliers).
        - GB_HMRC_VAT: UK HMRC VAT registration checker — supplier VAT number exists/name/address match (GB suppliers).
        - GB_VAT_ACT_1994: UK VAT Act 1994 — VAT rate validity.
        - GB_VAT_ACT_1994_S_8: UK VAT Act 1994 s.8 — reverse charge.
        - GB_VAT_NOTICE_700_S_16_3: UK VAT Notice 700 s.16.3 — full invoice requirements (> £250).
        - GB_VAT_NOTICE_700_S_16_6: UK VAT Notice 700 s.16.6 — simplified invoice requirements (≤ £250).
        - NL_ART_12_WET_OB: Dutch Art. 12 Wet OB 1968 — reverse charge (btw verlegd).
        - NL_ART_35A_WET_OB: Dutch Art. 35a Wet OB 1968 — full invoice requirements (> €100).
        - NL_ART_35D_WET_OB: Dutch Art. 35d Wet OB 1968 — simplified invoice requirements (≤ €100).
        - NL_ART_9_WET_OB: Dutch Art. 9 Wet OB 1968 — BTW rate validity.
      enum:
        - AT_P10_USTG
        - AT_P11_ABS_9_USTG
        - AT_P11_USTG
        - AT_P19_USTG
        - DE_P12_USTG
        - DE_P13B_USTG
        - DE_P14A_USTG
        - DE_P14_USTG
        - DE_P33_USTDV
        - EU_VAT_DIRECTIVE_ART_226
        - EU_VIES
        - GB_HMRC_VAT
        - GB_VAT_ACT_1994
        - GB_VAT_ACT_1994_S_8
        - GB_VAT_NOTICE_700_S_16_3
        - GB_VAT_NOTICE_700_S_16_6
        - NL_ART_12_WET_OB
        - NL_ART_35A_WET_OB
        - NL_ART_35D_WET_OB
        - NL_ART_9_WET_OB
        - UNKNOWN_DEFAULT_OPEN_API
      default: UNKNOWN_DEFAULT_OPEN_API
      example: DE_P14_USTG
    DocumentComplianceCheckIndividualCheckFieldError:
      type: object
      description: A field-level problem that caused a compliance check to fail.
      required:
        - fieldType
        - errorCategory
      properties:
        fieldId:
          type: string
          format: uuid
          description: Reference to the extracted field that triggered this error
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
        fieldType:
          $ref: '#/components/schemas/DocumentComplianceCheckFieldType'
        errorCategory:
          $ref: '#/components/schemas/DocumentComplianceCheckFieldErrorCategory'
        extractedValue:
          $ref: '#/components/schemas/DocumentComplianceCheckFieldValue'
        expectedValue:
          $ref: '#/components/schemas/DocumentComplianceCheckFieldValue'
    DocumentComplianceCheckFieldType:
      type: string
      description: The document field a compliance check field error relates to
      enum:
        - BUYER_ADDRESS
        - BUYER_NAME
        - BUYER_VAT_ID
        - DELIVERY_DATE
        - DESCRIPTION
        - EXPENSE_DATE
        - GROSS_AMOUNT
        - INVOICE_NUMBER
        - NET_AMOUNT
        - RC_WORDING
        - SUPPLIER_ADDRESS
        - SUPPLIER_COUNTRY
        - SUPPLIER_NAME
        - SUPPLIER_TAX_NUMBER
        - SUPPLIER_VAT_ID
        - UNKNOWN_DEFAULT_OPEN_API
        - VAT_AMOUNT
        - VAT_RATE
      default: UNKNOWN_DEFAULT_OPEN_API
      example: SUPPLIER_VAT_ID
    DocumentComplianceCheckFieldErrorCategory:
      type: string
      description: |
        - MISSING_VALUE: Expected value missing entirely.
        - DATA_INCOMPLETE: Data is not fully present. Deprecated, use DATA_INVALID instead.
        - DATA_MISMATCH: Data does not match master data.
        - DATA_INVALID: Data is present but its format or value is invalid, independent of master data.
      enum:
        - MISSING_VALUE
        - DATA_INCOMPLETE
        - DATA_MISMATCH
        - DATA_INVALID
        - UNKNOWN_DEFAULT_OPEN_API
      default: UNKNOWN_DEFAULT_OPEN_API
      example: DATA_MISMATCH
    DocumentComplianceCheckFieldValueType:
      type: string
      description: Type of a compliance check field value
      enum:
