    AccountingEventUpdateFinancialPeriodCommand:
      type: object
      description: |
        Updates the financial period of the source expense or bank transaction and archives
        the existing accounting event. A replacement event is generated asynchronously for
        bank transactions and completed expenses. The financial period must belong to the
        authenticated user's organization. Archived accounting events cannot be updated.
      required:
        - type
        - financialPeriodId
      properties:
        type:
          $ref: '#/components/schemas/AccountingEventCommandType'
        financialPeriodId:
          type: string
          format: uuid
          description: Unique identifier of the financial period to assign to the source object.
          example: b8e7c123-4567-89ab-cdef-123456789012
    AccountingEventArchiveAndRetryCommand:
      type: object
      description: |
        Archives the accounting event and retries to create. A replacement event is generated
        asynchronously. Archived accounting events cannot be recreated.
      required:
        - type
      properties:
