components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication using OAuth 2.0 client credentials flow.

        **Token Acquisition:**
        1. Create API keys in Settings → Platform → API Keys (admin only)
        2. Request access token: `POST {server_url}/oauth2/token`
        3. Use the `access_token` from response as Bearer token

        **Scopes:**
        - `read`: Access to read-only endpoints (GET operations)
        - `write`: Access to all endpoints (includes read + POST/PUT/DELETE operations)

        **Example:**
        ```
        Authorization: Bearer eyJhbGciOiJFUzI1NiJ9.eyJzdWIiOiI4MzliZWNlNS0xOTA2...
        ```
    OAuth2:
      type: oauth2
      description: OAuth 2.0 client credentials flow for obtaining access tokens
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            read: Access to read-only endpoints (GET operations)
            write: Access to all endpoints (includes read + POST/PUT/DELETE operations)
