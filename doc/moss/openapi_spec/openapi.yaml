        - $ref: '#/components/schemas/PostingInstructionLineUpdateAmountCommand'
        - $ref: '#/components/schemas/PostingInstructionLineUpdateMainAccountTypeCommand'
        - $ref: '#/components/schemas/PostingInstructionLineUpdateMainAccountIdCommand'
        - $ref: '#/components/schemas/PostingInstructionLineDeleteCommand'
    PostingInstructionUpdatePostingDateCommand:
      type: object
      description: Sets or unsets the posting date. postingDate is required for SET and must be absent for UNSET.
      required:
        - type
        - operation
      properties:
        type:
          $ref: '#/components/schemas/PostingInstructionCommandType'
        operation:
          $ref: '#/components/schemas/PostingInstructionUpdateOperation'
        postingDate:
          type: string
          format: date
          example: '2026-01-30'
    PostingInstructionUpdateCurrencyCommand:
      type: object
      description: Sets the currency of the posting instruction.
      required:
        - type
        - currency
      properties:
        type:
          $ref: '#/components/schemas/PostingInstructionCommandType'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code.
          example: EUR
    PostingInstructionDeleteCommand:
      type: object
      description: Deletes the posting instruction. The posting instruction must be DRAFTED.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/PostingInstructionCommandType'
    PostingInstructionAddLineCommand:
      type: object
      description: Adds a new line to the posting instruction. The posting instruction must be DRAFTED.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/PostingInstructionCommandType'
    PostingInstructionSubmitCommand:
      type: object
      description: Submits the posting instruction, moving it from DRAFTED to POSTED.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/PostingInstructionCommandType'
    PostingInstructionLineUpdateBookingTextCommand:
      type: object
      description: Sets or unsets the booking text. bookingText is required for SET and must be absent for UNSET.
      required:
        - type
        - operation
      properties:
        type:
          $ref: '#/components/schemas/PostingInstructionLineCommandType'
        operation:
          $ref: '#/components/schemas/PostingInstructionUpdateOperation'
        bookingText:
          type: string
          example: Office supplies
    PostingInstructionLineUpdateAmountCommand:
      type: object
      description: Sets or unsets direction and amount together. Both are required for SET and must be absent for UNSET.
      required:
        - type
        - operation
      properties:
        type:
          $ref: '#/components/schemas/PostingInstructionLineCommandType'
        operation:
          $ref: '#/components/schemas/PostingInstructionUpdateOperation'
        direction:
          $ref: '#/components/schemas/PostingDirection'
        amount:
          type: number
          minimum: 0
          example: 100.5
    PostingInstructionLineUpdateMainAccountTypeCommand:
      type: object
      description: Sets the main account type. If the type changes, mainAccountId is cleared.
      required:
        - type
        - mainAccountType
      properties:
        type:
          $ref: '#/components/schemas/PostingInstructionLineCommandType'
        mainAccountType:
          $ref: '#/components/schemas/PostingInstructionAccountType'
    PostingInstructionLineUpdateMainAccountIdCommand:
      type: object
      description: Sets the main account id. Must resolve to an active entity matching the line's main account type.
      required:
        - type
        - mainAccountId
      properties:
        type:
          $ref: '#/components/schemas/PostingInstructionLineCommandType'
        mainAccountId:
          type: string
          format: uuid
    PostingInstructionLineDeleteCommand:
      type: object
      description: Deletes the line.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/PostingInstructionLineCommandType'
