info:
  title: Moss public API
  version: 1.55.1
  license:
    name: Proprietary
    url: https://getmoss.com/public/terms-and-conditions/20260206_INT-en_Nufin_GmbH_Moss_API_Terms_And_Conditions_v1.0.pdf
  description: |
    Public API for getmoss.com services

    ## Authentication

    This API uses OAuth 2.0 client credentials flow to obtain Bearer tokens for authentication.

    ### Getting Started

    1. **Create API Keys**: Only admins can create API keys. Go to Settings → Platform → API Keys
    2. **Obtain Access Token**: Use your Key ID and Secret Key to request a Bearer token
    3. **Use Bearer Token**: Include the token in API requests via Authorization header

    ### OAuth 2.0 Token Request

    **Endpoint:** `POST {server_url}/oauth2/token`

    **Request Examples:**

    *Staging:*
    ```bash
    curl -v -X POST "https://public-api.runmoss.run/oauth2/token" \
         -H "content-type: application/x-www-form-urlencoded" \
         -d 'grant_type=client_credentials&client_id=kid_FaYnufhSMSP1qaXy&client_secret=sk_rKvWDzU6h46hiy3tluqskkrX6pepQTXI'
    ```

    *Production (when available):*
    ```bash
    curl -v -X POST "https://public-api.getmoss.com/oauth2/token" \
         -H "content-type: application/x-www-form-urlencoded" \
         -d 'grant_type=client_credentials&client_id=kid_FaYnufhSMSP1qaXy&client_secret=sk_rKvWDzU6h46hiy3tluqskkrX6pepQTXI'
    ```

    **Request Parameters:**
    - `grant_type`: Must be `client_credentials`
    - `client_id`: Your Key ID (starts with `kid_`)
    - `client_secret`: Your Secret Key (starts with `sk_`)

    **Response Example:**
    ```json
    {
      "access_token": "eyJhbGciOiJFUzI1NiJ9..UM2yAVhFQsjKfAnAbrBDBtBicIe5ph2_kqLP9-iFjiCCgn9s2g30EhPpL-LgVcI3xY3u33igcl_RKe1FXxnR1w",
      "token_type": "Bearer",
      "expires_in": 3600,
      "scope": "read"
    }
    ```

    ### Using Access Tokens

    Include the `access_token` value in the Authorization header of your API requests:
    ```
    Authorization: Bearer <ACCESS_TOKEN>
    ```

    **Example API Requests:**

    *Staging:*
    ```bash
    # Wall of shame endpoint - COMMENTED OUT FOR FUTURE USE
    # curl -H "Authorization: Bearer eyJhbGciOiJFUzI1NiJ9..UM2yAVhFQsjKfAnAbrBDBtBicIe5ph2_kqLP9-iFjiCCgn9s2g30EhPpL-LgVcI3xY3u33igcl_RKe1FXxnR1w" \
    #      https://public-api.runmoss.run/v1/wall-of-shame

    curl -H "Authorization: Bearer YOUR_ACCESS_TOKEN" \
         https://public-api.runmoss.run/v1/expenses
    ```

    *Production (when available):*
    ```bash
    # Wall of shame endpoint - COMMENTED OUT FOR FUTURE USE
    # curl -H "Authorization: Bearer eyJhbGciOiJFUzI1NiJ9..UM2yAVhFQsjKfAnAbrBDBtBicIe5ph2_kqLP9-iFjiCCgn9s2g30EhPpL-LgVcI3xY3u33igcl_RKe1FXxnR1w" \
    #      https://public-api.getmoss.com/v1/wall-of-shame

    curl -H "Authorization: Bearer YOUR_ACCESS_TOKEN" \
         https://public-api.getmoss.com/v1/expenses
    ```

    ### Token Management

    - **Token Lifetime**: Access tokens expire after 1 hour (3600 seconds)
    - **Token Refresh**: Since this is client credentials flow, request a new token when the current one expires
    - **Token Format**: JWT (JSON Web Token) with embedded user and scope information

    ### Scopes and Permissions

    - **`read`**: Grants access to GET endpoints for retrieving data
    - **`write`**: Grants access to all endpoints including POST, PUT, DELETE operations
    - **Scope Hierarchy**: `write` scope includes `read` permissions

    ### API Key Management

    **Creating API Keys:**
    1. Log in to your Moss account as an admin
    2. Navigate to Settings → Platform → API Keys
    3. Click "Create API Key"
    4. Confirm the operation with Moss mobile app
    5. Save both the Key ID (`kid_*`) and Secret Key (`sk_*`) securely
    6. **Important**: Store credentials securely and never expose them in client-side code

    **Security Best Practices:**
    - Rotate API keys regularly
    - Use environment variables to store credentials
    - Never commit API keys to version control
    - Monitor API key usage for suspicious activity

    ## Rate Limiting

    All API endpoints are subject to rate limiting per organization and OAuth scope.

    ### Response Headers

    Every API response includes the following rate limiting headers:

    | Header | Description |
    |--------|-------------|
    | `X-RateLimit-Limit` | Maximum requests allowed in the current rate limit window |
    | `X-RateLimit-Remaining` | Requests remaining in the current window |
    | `X-RateLimit-Reset` | Unix timestamp (UTC seconds) when the window resets |
    | `X-RateLimit-Scope` | Scope bucket for this limit: `read` (GET) or `write` (POST/PUT/DELETE) |

    ### Rate Limit Exceeded (HTTP 429)

    When the rate limit is exceeded the API returns HTTP **429 Too Many Requests** with:
    - All four `X-RateLimit-*` headers (`X-RateLimit-Remaining` will be `0`)
    - `Retry-After` header with the number of seconds to wait before retrying
    - A JSON error body with `type: ERR_RATE_LIMIT_EXCEEDED`

    ### Best Practices

    - Monitor `X-RateLimit-Remaining` to avoid hitting the limit
    - Implement exponential backoff when receiving 429 responses
    - Respect the `Retry-After` header value when retrying
