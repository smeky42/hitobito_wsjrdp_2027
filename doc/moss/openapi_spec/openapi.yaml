    PostingInstructionCommand:
      type: object
      description: A command applied to a posting instruction, selected by `type`.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/PostingInstructionCommandType'
      discriminator:
        propertyName: type
        mapping:
          UPDATE_POSTING_DATE: '#/components/schemas/PostingInstructionUpdatePostingDateCommand'
          UPDATE_CURRENCY: '#/components/schemas/PostingInstructionUpdateCurrencyCommand'
          DELETE: '#/components/schemas/PostingInstructionDeleteCommand'
          ADD_LINE: '#/components/schemas/PostingInstructionAddLineCommand'
          SUBMIT: '#/components/schemas/PostingInstructionSubmitCommand'
