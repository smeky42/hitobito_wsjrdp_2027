        - $ref: '#/components/schemas/PostingInstructionUpdateCurrencyCommand'
        - $ref: '#/components/schemas/PostingInstructionDeleteCommand'
        - $ref: '#/components/schemas/PostingInstructionAddLineCommand'
        - $ref: '#/components/schemas/PostingInstructionSubmitCommand'
    PostingInstructionLineCommand:
      type: object
      description: A command applied to a posting instruction line, selected by `type`.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/PostingInstructionLineCommandType'
      discriminator:
        propertyName: type
        mapping:
          UPDATE_BOOKING_TEXT: '#/components/schemas/PostingInstructionLineUpdateBookingTextCommand'
          UPDATE_AMOUNT: '#/components/schemas/PostingInstructionLineUpdateAmountCommand'
          UPDATE_MAIN_ACCOUNT_TYPE: '#/components/schemas/PostingInstructionLineUpdateMainAccountTypeCommand'
          UPDATE_MAIN_ACCOUNT_ID: '#/components/schemas/PostingInstructionLineUpdateMainAccountIdCommand'
          DELETE: '#/components/schemas/PostingInstructionLineDeleteCommand'
