  /v1/bank-accounts:
    get:
      tags:
        - Bank Accounts
      operationId: getAllBankAccounts
      summary: Get all bank accounts
      description: |
        Returns all Moss bank accounts (wallets) for the authenticated user's organisation.

        Each bank account has a funding type (`CREDIT` for credit-funded accounts, `DEBIT` for debit-funded accounts), a currency, and a status (`ACTIVE` or `CLOSED`). Use the returned `id` to retrieve the account balance or to filter bank transactions.

        No pagination is supported as the number of bank accounts per organisation is small.
      security:
        - BearerAuth: []
      parameters:
        - name: moss-trace-id
          in: header
          description: Request tracing identifier
          required: false
          schema:
            type: string
            example: 026cb8891f2f1bc257f6876ce4878a3f
      responses:
        '200':
          description: Bank accounts data
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (e.g., user has no organizations, insufficient scope privileges)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/bank-accounts/{bankAccountId}/balance:
    get:
      tags:
        - Bank Accounts
      operationId: getBankAccountBalance
      summary: Get bank account balance
      description: |
        Returns the current balance for a specific bank account within the authenticated user's organisation.

        The response includes two balance fields:
        - `balance`: The current ledger balance of the account.
        - `availableBalance`: The balance available for spending, which may be lower than `balance` due to pending or reserved transactions.

        Both values are returned as Money objects with `amount` and `currency` fields.
      security:
        - BearerAuth: []
      parameters:
        - name: bankAccountId
          in: path
          description: UUID of the bank account to retrieve balance information for
          required: true
          schema:
            type: string
            format: uuid
            example: 837574c8-e813-4bb3-b31e-c7358758c29c
        - name: moss-trace-id
          in: header
          description: Request tracing identifier
          required: false
          schema:
            type: string
            example: 026cb8891f2f1bc257f6876ce4878a3f
      responses:
        '200':
          description: Bank account balance information retrieved successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountBalanceResponse'
        '400':
          description: Bad request (e.g., invalid bank account ID format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (e.g., user has no organizations, insufficient scope privileges)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Bank account not found in organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/bank-transactions/search-query:
    post:
      tags:
        - Bank Transactions
      operationId: searchBankTransactions
      summary: Search bank transactions
      description: |
        Returns a paginated list of bank transactions, optionally filtered by bank account, within a date range.

        Bank transactions represent money movements in Moss wallets, including card purchases, payouts to external bank accounts, top-ups, ATM withdrawals, and repayments. Each transaction includes the total amount (inclusive of any fees), booking and value dates, and an array of associated fees broken down by type (e.g., FX fee, payment fee).

        The request body requires `bookingDateFrom` and `bookingDateTo`. Use optional `accountIds` to filter one or more bank accounts. The deprecated optional `bankAccountId` filter is still accepted for backwards compatibility. Provide either `accountIds` or `bankAccountId`, not both. Pagination and sorting are optional; results are sorted by `bookingDate` descending by default.
      security:
        - BearerAuth: []
      parameters:
        - name: moss-trace-id
          in: header
          description: Request tracing identifier
          required: false
          schema:
            type: string
            example: 026cb8891f2f1bc257f6876ce4878a3f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankTransactionsSearchRequest'
      responses:
        '200':
          description: Bank transactions data
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransactionsResponse'
        '400':
          description: Bad request (e.g., invalid filter parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (e.g., user has no organizations, insufficient scope privileges)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /v1/files/search-query:
    post:
      tags:
        - Files
      operationId: searchFiles
      summary: Search files
      description: |
        Returns a paginated list of files for the authenticated user's organization based on the provided search criteria.

        _Note_: If you specify expense IDs, only files directly attached to those expenses will be returned. If you wish to find
        files attached the line objects you must request those separately.

        _Note_: Reimbursement lines that have been split (expense type `REIMBURSEMENT_INVOICE_LINE_SPLIT`) never carry
        their own file attachments - the receipt is attached to the parent line instead. If you
        pass the ID of a split line, this endpoint automatically resolves it to its parent line and returns the files
        attached there.
      security:
        - BearerAuth: []
      parameters:
        - name: moss-trace-id
          in: header
          description: Request tracing identifier
          required: false
          schema:
            type: string
            example: 026cb8891f2f1bc257f6876ce4878a3f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileSearchRequest'
      responses:
        '200':
          description: Files data
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
          content:
