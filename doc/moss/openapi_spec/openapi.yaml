          required: false
          schema:
            type: string
            example: 026cb8891f2f1bc257f6876ce4878a3f
        - name: type
          in: query
          description: Filter by expense types (can specify multiple)
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/HeaderExpenseType'
            uniqueItems: true
            maxItems: 3
        - name: page
          in: query
          description: Page number for pagination (1-based)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: Filter by expense status (can specify multiple)
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ExpenseStatus'
            uniqueItems: true
            maxItems: 13
        - name: export_status
          in: query
          description: Filter by export status (can specify multiple)
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ExportStatus'
            uniqueItems: true
            maxItems: 5
        - name: id
          in: query
          description: Filter by specific expense entity IDs (can specify multiple, max 100)
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
            uniqueItems: true
            maxItems: 100
        - name: create_date__gte
          in: query
          description: Filter expenses created on or after this date (ISO 8601 date format)
          required: false
          schema:
            type: string
            format: date
            example: '2024-01-15'
        - name: create_date__lte
          in: query
          description: Filter expenses created on or before this date (ISO 8601 date format)
          required: false
          schema:
            type: string
            format: date
            example: '2024-12-31'
        - name: expense_date__gte
          in: query
          description: Filter expenses with expense date on or after this date (ISO 8601 date format)
          required: false
          schema:
            type: string
            format: date
            example: '2024-01-15'
        - name: expense_date__lte
          in: query
          description: Filter expenses with expense date on or before this date (ISO 8601 date format)
          required: false
          schema:
            type: string
            format: date
            example: '2024-12-31'
        - name: update_time__gte
          in: query
          description: Filter expenses last updated on or after this timestamp (ISO-8601)
          required: false
          schema:
            type: string
            format: date-time
            example: '2023-10-01T15:30:00Z'
        - name: update_time__lte
          in: query
          description: Filter expenses last updated before this timestamp (ISO-8601)
          required: false
          schema:
            type: string
            format: date-time
            example: '2023-10-01T15:30:00Z'
        - name: sort
          in: query
          description: |
            Sort expenses by field with direction. Format: [+|-]field_name
            Use + for ascending (default) or - for descending order.
            Only one sort field allowed at a time.

            Available fields:
            - status: Sort by expense status
            - create_time: Sort by creation time
            - home_amount: Sort by expense amount
            - expense_time: Sort by expense date/time
          required: false
          schema:
            type: string
            pattern: ^[+-]?(status|create_time|home_amount|expense_time)$
            example: '-home_amount'
      responses:
