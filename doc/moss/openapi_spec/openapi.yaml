              - 48d60159-2554-414e-ae5e-3177d12f4e4f
              - 5b2deb68-b3c8-470e-885d-132af66de5bb
        - name: sort
          in: query
          description: |
            Sort departments by name with direction. Format: [+|-]name
            Use + for ascending (default) or - for descending order.

            Available fields:
            - name: Sort by department name
          required: false
          schema:
            type: string
            pattern: ^[+-]?name$
            example: name
      responses:
        '200':
          description: Departments data
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
            X-RateLimit-Scope:
              $ref: '#/components/headers/X-RateLimit-Scope'
          content:
