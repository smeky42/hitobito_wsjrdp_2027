  headers:
    X-RateLimit-Limit:
      description: Maximum number of requests allowed in the current rate limit window for the used scope.
      schema:
        type: integer
        example: 30
    X-RateLimit-Remaining:
      description: Number of requests remaining in the current rate limit window.
      schema:
        type: integer
        example: 25
    X-RateLimit-Reset:
      description: Unix timestamp (seconds since epoch, UTC) when the rate limit window resets.
      schema:
        type: integer
        format: int64
        example: 1704067200
    X-RateLimit-Scope:
      description: 'The OAuth scope bucket to which this rate limit applies: `read` or `write`.'
      schema:
        type: string
        example: read
    Retry-After:
      description: Number of seconds to wait before retrying. Only present on 429 Too Many Requests responses.
      schema:
        type: integer
        example: 15
  responses:
    PostingInstructionCommandBadRequest:
      description: |
        Invalid request or the command was rejected. A rejected command returns one error per failed check;
        the error `type` distinguishes the reason:
        - `ERR_VALIDATION_FAILED`: the request is malformed or a field is invalid (see `pointer`).
        - `ERR_POSTING_INSTRUCTION_INVALID_STATUS`: the posting instruction's current status does not allow this command.
        - `ERR_POSTING_INSTRUCTION_DATE_ABSENT`: the posting instruction has no posting date, but the command requires one.
        - `ERR_POSTING_INSTRUCTION_NO_LINES`: the posting instruction has no lines.
        - `ERR_POSTING_INSTRUCTION_REFERENCE_NOT_FOUND`: the entity the posting instruction references could not be found.
        - `ERR_POSTING_INSTRUCTION_BANK_ACCOUNT_GL_ACCOUNT_NOT_SET`: the referenced bank account has no general ledger account configured.
        - `ERR_POSTING_INSTRUCTION_MAIN_ACCOUNT_TYPE_NOT_SET`: a line's main account type must be set.
        - `ERR_POSTING_INSTRUCTION_MAIN_ACCOUNT_ID_NOT_SET`: a line's main account id must be set and resolve to an existing, active entity.
        - `ERR_POSTING_INSTRUCTION_CONTRA_ACCOUNT_TYPE_NOT_SET`: a line's contra account type must be set.
        - `ERR_POSTING_INSTRUCTION_CONTRA_ACCOUNT_ID_NOT_SET`: a line's contra account id must be set.
        - `ERR_POSTING_INSTRUCTION_DIRECTION_NOT_SET`: a line's posting direction must be set.
        - `ERR_POSTING_INSTRUCTION_AMOUNT_INVALID`: a line's amount must be set and greater than zero.
        - `ERR_POSTING_INSTRUCTION_BOOKING_TEXT_ABSENT`: a line's booking text must be set.
        - `ERR_POSTING_INSTRUCTION_BANK_TRANSACTION_ALLOCATION_EXCEEDS_REMAINING_AMOUNT`: the lines' total amount exceeds the referenced bank transaction's remaining unallocated amount.
        - `ERR_POSTING_INSTRUCTION_REFERENCE_NET_AMOUNT_NOT_POSITIVE`: the lines' signed total, netted against the reference's expected direction, is zero or negative.
        - `ERR_POSTING_INSTRUCTION_CURRENCY_MISMATCH`: the posting instruction's currency does not match the referenced bank transaction's or open item's currency.
        - `ERR_POSTING_INSTRUCTION_REFERENCE_NOT_OPEN`: the referenced open item is not open, or its full amount is already reserved by a payment.
        - `ERR_POSTING_INSTRUCTION_REFERENCE_DIRECTION_MISMATCH`: a line would increase the referenced open item's outstanding amount instead of reducing it.
        - `ERR_POSTING_INSTRUCTION_OPEN_ITEM_ALLOCATION_EXCEEDS_OUTSTANDING_AMOUNT`: the lines' total amount exceeds the referenced open item's outstanding amount not already reserved by a payment.
        - `ERR_POSTING_INSTRUCTION_LINE_OPEN_ITEM_HAS_DEPENDENT_ALLOCATIONS`: reverting is blocked because a line's open item has a bank or adjustment allocation from another document.
        - `ERR_POSTING_INSTRUCTION_COMMAND_FAILED`: the command was rejected for another reason.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Bad gateway. An upstream service could not be reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            meta:
              apiVersion: 1.6.0
              tracingId: 026cb8891f2f1bc257f6876ce4878a3f
            errors:
              - type: ERR_BAD_GATEWAY
                title: Bad gateway
                detail: An upstream service could not be reached. Please try again later.
                status: 502
                instance: /v1/teams
    GatewayTimeout:
      description: Gateway timeout. An upstream service did not respond in time.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            meta:
              apiVersion: 1.6.0
              tracingId: 026cb8891f2f1bc257f6876ce4878a3f
            errors:
              - type: ERR_GATEWAY_TIMEOUT
                title: Upstream service timed out
                detail: An upstream service did not respond in time. Please try again.
                status: 504
                instance: /v1/teams
    ServiceUnavailable:
      description: Service temporarily unavailable. An upstream service returned a 503 error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            data: null
            meta:
              apiVersion: 1.6.0
              tracingId: 026cb8891f2f1bc257f6876ce4878a3f
            errors:
              - type: ERR_SERVICE_UNAVAILABLE
                title: Service unavailable
                detail: An upstream service is temporarily unavailable. Please try again later.
                status: 503
                instance: /v1/expenses
    TooManyRequests:
      description: Rate limit exceeded. Reduce request frequency and retry after the indicated number of seconds.
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
        X-RateLimit-Scope:
          $ref: '#/components/headers/X-RateLimit-Scope'
        Retry-After:
