        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (e.g., user has no organizations, insufficient scope privileges)
          content:
            application/json:
              schema:
