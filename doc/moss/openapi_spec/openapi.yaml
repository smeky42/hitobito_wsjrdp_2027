    Expense:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the expense
          example: b8e7c123-4567-89ab-cdef-123456789012
        expenseSubType:
          anyOf:
            - $ref: '#/components/schemas/ExpenseSubtype'
            - type: 'null'
          description: Subtype of the expense
        bookingText:
          type:
            - string
            - 'null'
          description: Booking text associated with the expense
          example: Travel booking - Conference 2024
        description:
          type:
            - string
            - 'null'
          description: Description of the expense
          example: Office supplies
        createTime:
          type: string
          format: date-time
          description: Creation timestamp (ISO-8601)
          example: '2024-01-15T10:30:00Z'
        updateTime:
          type: string
          format: date-time
          description: Last update timestamp (ISO-8601)
          example: '2024-01-15T14:45:00Z'
        expenseMetadata:
          anyOf:
            - $ref: '#/components/schemas/ExpenseMetadata'
            - type: 'null'
          description: Type-specific metadata containing additional information for this expense
        organisationId:
          type: string
          format: uuid
          description: Unique identifier of the organisation the expense is attributed to
          example: a1b2c3d4-5678-9abc-def0-123456789012
        createdBy:
          type: string
          format: uuid
          description: ID of the user who created the expense
          example: e5f6a7b8-1234-5678-9abc-def012345678
        expenseType:
          $ref: '#/components/schemas/ExpenseType'
          description: Type of the expense
        status:
          anyOf:
            - $ref: '#/components/schemas/ExpenseStatus'
            - type: 'null'
          description: Current status of the expense
        supplierId:
          type:
            - string
            - 'null'
          format: uuid
          description: Unique identifier of the supplier associated with the expense
          example: c9d0e1f2-3456-7890-abcd-ef0123456789
        amount:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Expense amount in the original currency
          example:
            amount: '119.25'
            currency: USD
        homeAmount:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Expense amount in the organisation's home currency
          example:
            amount: '100.54'
            currency: EUR
        expenseTime:
          type: string
          format: date-time
          description: |
            - For **CARD_TRANSACTION**, this field is the receipt date if a receipt exists, otherwise it is the transaction date.
            - For **INVOICE**, this field is the invoice date: Date on the invoice.
            - For **REIMBURSEMENT**, this field is the submitted date: Date the reimbursement was submitted.
          example: '2024-01-15T09:00:00Z'
        servicePeriodFrom:
          type:
            - string
            - 'null'
          format: date
          description: Start date of the service period (YYYY-MM-DD)
          example: '2024-01-01'
        servicePeriodTo:
          type:
            - string
            - 'null'
          format: date
          description: End date of the service period (YYYY-MM-DD)
          example: '2024-01-31'
        exportMetadata:
          anyOf:
            - $ref: '#/components/schemas/ExportMetadata'
            - type: 'null'
          description: Metadata related to expense export to accounting systems
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseLine'
          default: []
          description: Expense line items
      required:
        - id
        - expenseType
        - createTime
        - updateTime
        - organisationId
        - createdBy
        - expenseTime
      description: |
        Expense structure containing both parent-level information and common metadata.

        **Common fields** are shared across all expense types and include basic information
        like timestamps, descriptions, and expense metadata.

        **Parent fields** represent the main expense record information including organization
        details, approval status, supplier information, and export metadata.

        **Expense lines** contain line-item details including amounts, tax information,
        cost center assignments, and line-specific hospitality data.
    ExpenseLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the expense
          example: 123e4567-e89b-12d3-a456-426614174000
        expenseType:
          $ref: '#/components/schemas/ExpenseType'
          description: Type of the expense
        expenseSubType:
          $ref: '#/components/schemas/ExpenseSubtype'
        bookingText:
          type:
            - string
            - 'null'
          description: Booking text associated with the expense
          example: Office Supplies - Paper
        description:
          type:
            - string
            - 'null'
          description: Description of the expense
          example: Monthly office paper supply order
        createTime:
          type: string
          format: date-time
          description: Creation timestamp (ISO-8601)
          example: '2023-10-01T10:00:00Z'
        updateTime:
          type: string
          format: date-time
          description: Last update timestamp (ISO-8601)
          example: '2023-10-01T15:30:00Z'
        expenseTime:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            Date and time associated with this expense line.
            - For **CARD_TRANSACTION_LINE** and **FX_FEE**, this is the date of the related card transaction.
            - For **INVOICE_LINE**, this is the invoice date, when available.
            - For **REIMBURSEMENT**, this is the date the reimbursement was submitted.
            - For **REIMBURSEMENT_INVOICE_LINE** and **REIMBURSEMENT_INVOICE_LINE_SPLIT**, this is the reported purchase date.
            - For **MILEAGE_LINE**, this is the date of the journey.
            - For **MILEAGE_LINE_SPLIT**, this is the date of the journey, inherited from the parent mileage line.
            - For **PER_DIEM_LINE**, this is the start date and time of the trip.
          example: '2023-10-01T09:00:00Z'
        expenseAccountId:
          type:
            - string
            - 'null'
          format: uuid
          description: Unique identifier of the expense account assigned to this expense
          example: 123e4567-e89b-12d3-a456-426614174001
        taxRateId:
          type:
            - string
            - 'null'
          format: uuid
          description: Unique identifier of the tax rate applied to this expense line
          example: 123e4567-e89b-12d3-a456-426614174002
        netAmount:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Net amount of the expense line with currency
          example:
            amount: '100.50'
            currency: EUR
        netAmountOverride:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Override value for the net amount with currency
          example:
            amount: '105.00'
            currency: EUR
        netHomeAmount:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Net amount of the expense line in the home currency
          example:
            amount: '95.75'
            currency: USD
        netHomeAmountOverride:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Override value for the net amount in the home currency
          example:
            amount: '100.25'
            currency: USD
        amount:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Total amount of the expense line with currency
          example:
            amount: '120.60'
            currency: EUR
        homeAmount:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Expense amount in the organisation's home currency
          example:
            amount: '114.90'
            currency: USD
        conversionRate:
          type:
            - number
            - 'null'
          format: double
          description: Exchange rate used to convert the expense amount to the home currency
          example: 1.0523
        grossAmount:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Gross amount of the expense line with currency
          example:
            amount: '143.52'
            currency: EUR
        vatAmount:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: VAT amount applied to the expense line with currency
          example:
            amount: '22.92'
            currency: EUR
        vatAmountOverride:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Override value for the VAT amount with currency
          example:
            amount: '25.00'
            currency: EUR
        quantity:
          type:
            - integer
            - 'null'
          description: Quantity of items in the expense line
          example: 5
        unitPrice:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Price per unit with currency
          example:
            amount: '24.12'
            currency: EUR
        unitPriceOverride:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Override value for the unit price with currency
          example:
            amount: '25.00'
            currency: EUR
        grossPercentage:
          type:
            - number
            - 'null'
          format: double
          description: Gross percentage applied to the expense line
          example: 19
        hospitalityExpense:
          type: boolean
          default: false
          description: Indicates whether this expense line is a hospitality expense
          example: false
        internalParticipants:
          type: array
          items:
            $ref: '#/components/schemas/HospitalityExpenseParticipant'
          default: []
          description: Internal participants associated with this hospitality expense
        externalParticipants:
          type: array
          items:
            $ref: '#/components/schemas/HospitalityExpenseParticipant'
          default: []
          description: External participants associated with this hospitality expense
        tip:
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Tip amount associated with this hospitality expense with currency
          example:
            amount: '15.50'
            currency: EUR
        hospitalityPurpose:
          type:
            - string
            - 'null'
          description: Purpose of this hospitality expense
          example: Client meeting dinner
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseDimension'
          default: []
          description: |
            Accounting dimensions assigned to this expense line.
            Cost center and cost carrier dimensions have fixed dimension ids, while other dimensions have non-fixed UUIDs.
            Cost center dimension has id 00000000-0000-0000-0000-000000000001.
            Cost carrier dimension has id 00000000-0000-0000-0000-000000000002.
        expenseMetadata:
          anyOf:
            - $ref: '#/components/schemas/ExpenseMetadata'
            - type: 'null'
          description: Type-specific metadata containing additional information for this expense line
      required:
        - id
        - expenseType
