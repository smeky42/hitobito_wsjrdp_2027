type: object
required:
  - connectionId
  - types
properties:
  connectionId:
    type: string
    format: uuid
    description: Accounting connection identifier used for the import.
  types:
    type: array
    minItems: 1
    description: Resource types to import.
    items:
      $ref: './ImportableResourceType.yaml'
  resourceIds:
    type: array
    nullable: true
    description: Optional resource identifiers for targeted re-import.
    items:
      type: string
      format: uuid
