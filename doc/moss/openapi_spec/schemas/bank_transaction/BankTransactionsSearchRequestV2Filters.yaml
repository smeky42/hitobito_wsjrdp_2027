type: object
properties:
  ids:
    type: array
    description: Moss IDs of the transactions to search for.
    items:
      type: string
      format: uuid
    example:
      - "123e4567-e89b-12d3-a456-426614174000"
      - "223e4567-e89b-12d3-a456-426614174000"
  accountIds:
    type: array
    description: Optional. Filter transactions by one or more bank account IDs. Do not provide together with deprecated bankAccountId.
    items:
      type: string
      format: uuid
    example:
      - "123e4567-e89b-12d3-a456-426614174000"
      - "223e4567-e89b-12d3-a456-426614174000"
  bookingDateFrom:
    type: string
    format: date
    description: Filter transactions with booking date from this date (inclusive)
    example: "2024-01-01"
  bookingDateTo:
    type: string
    format: date
    description: Filter transactions with booking date to this date (inclusive)
    example: "2024-01-31"
  amountMin:
    type: number
    format: double
    description: Filter transactions with amount greater or equal to this value
  amountMax:
    type: number
    format: double
    description: Filter transactions with amount less or equal to this value
  matched:
    deprecated: true
    type: boolean
    description: >
      Deprecated filter, use matchedStatuses instead. When both are provided, matchedStatuses takes precedence.
      Filter transactions that have been matched/not matched to an open item.
  matchedStatuses:
    type: array
    uniqueItems: true
    minItems: 1
    description: Filter transactions by the provided statuses.
    items:
      $ref: '../../openapi.yaml#/components/schemas/BankTransactionMatchedStatus'
  transactionTypes:
    type: array
    uniqueItems: true
    minItems: 1
    description: |
      Filter transactions by the provided transaction types. Transactions matching any of the given types are returned.

      **Possible values:**
      - `CARD`: A card transaction, such as a purchase or refund.
      - `PAYOUT`: A payout transaction, such as a transfer to a bank account.
      - `WITHDRAWAL`: A withdrawal transaction, such as an ATM withdrawal.
      - `TOP_UP`: A top-up transaction, such as adding funds to a card.
      - `REPAYMENT`: A repayment transaction, such as repaying a card balance.
    example: [CARD, REPAYMENT]
    items:
      $ref: '../../openapi.yaml#/components/schemas/BankTransactionTypeV2'
  readyToMatch:
    type: boolean
    description: Filter transactions by whether they have valid match candidates.
  showExcludedFromProcessing:
    type: boolean
    description: Filter transactions that are excluded from processing.
  freeText:
    type: string
    description: Case-insensitive partial match across bank transaction id, group id, counterparty and bank account number.
