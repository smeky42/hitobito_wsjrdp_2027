type: object
required:
  - matches
properties:
  matches:
    type: array
    minItems: 1
    maxItems: 10
    description: >
      Open items to match this bank transaction against. An open item with an `amount` is allocated exactly
      that amount. Open items without an `amount` are then filled from what is left of the bank transaction,
      oldest first, so the last one(s) may only be partially matched.
    items:
      $ref: '../../openapi.yaml#/components/schemas/BankTransactionOpenItemMatch'
    example:
      - openItemId: "123e4567-e89b-12d3-a456-426614174000"
        amount: "120.50"
      - openItemId: "9b2f6c1e-4d3a-4f8e-a1b2-c3d4e5f6a7b8"
