type: object
description: A mapping that links a bank account to a general ledger account for bank reconciliation purposes.
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier of the bank ledger mapping.
    example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
  bankAccountId:
    type: string
    format: uuid
    description: Unique identifier of the bank account.
    example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
  glAccountContinuityId:
    type: string
    format: uuid
    description: Continuity ID of the general ledger account. Stays the same across account versions if applicable.
    example: "7c1e9a52-4d3b-4f8e-a6b2-91d0c5e3f7a4"
required: [id, bankAccountId, glAccountContinuityId]
