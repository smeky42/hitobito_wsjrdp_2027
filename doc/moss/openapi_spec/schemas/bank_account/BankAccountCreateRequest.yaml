type: object
required:
  - accountIdentifierScheme
  - name
  - currency
description: |
  Depending on `accountIdentifierScheme`, exactly one of the following field groups is required:
  - `IBAN` -> `iban`
  - `UK_SORT_CODE` -> `sortCode` + `accountNumber`
  - `US_ACH` -> `routingNumber` + `accountNumber`
  - `CH_BCN` / `SE_CLEARING` / `NO_BANK_ACCOUNT` -> `clearingNumber` + `accountNumber`
  - `DK_REG_ACCOUNT` -> `registrationNumber` + `accountNumber`
  - `AMEX` / `PAYPAL` -> `accountId`

  `MOSS` and `OTHER` are not supported by this endpoint.
properties:
  accountIdentifierScheme:
    $ref: '../../openapi.yaml#/components/schemas/BankAccountIdentifierScheme'
  name:
    type: string
    description: Display name of the bank account.
    example: "Main operating account"
  currency:
    type: string
    format: iso-4217
    description: ISO 4217 currency code for the currency of the bank account.
    example: "EUR"
  iban:
    type: string
    description: International Bank Account Number. Required when `accountIdentifierScheme` is `IBAN`.
    example: "DE89370400440532013000"
  accountNumber:
    type: string
    description: >-
      Account number (UK account number, US account number, etc.).
      Required when `accountIdentifierScheme` is `UK_SORT_CODE`, `US_ACH`, `CH_BCN`,
      `SE_CLEARING`, `NO_BANK_ACCOUNT`, or `DK_REG_ACCOUNT`.
  sortCode:
    type: string
    description: Sort code. Required when `accountIdentifierScheme` is `UK_SORT_CODE`.
    example: "200000"
  routingNumber:
    type: string
    description: Routing number. Required when `accountIdentifierScheme` is `US_ACH`.
    example: "021000021"
  clearingNumber:
    type: string
    description: >-
      Clearing number.
      Required when `accountIdentifierScheme` is `CH_BCN`, `SE_CLEARING`, or `NO_BANK_ACCOUNT`.
  registrationNumber:
    type: string
    description: Registration number. Required when `accountIdentifierScheme` is `DK_REG_ACCOUNT`.
  accountId:
    type: string
    description: >-
      Account identifier.
      Required when `accountIdentifierScheme` is `AMEX` or `PAYPAL`.
  alias:
    type: string
    description: Optional user-defined alias/display name override for the bank account.
  expenseAccountId:
    type: string
    format: uuid
    description: Unique identifier of the expense account to map this bank account to.
    example: "123e4567-e89b-12d3-a456-426614174001"
  earliestClosingBalance:
    $ref: '../../openapi.yaml#/components/schemas/BankBalance'
    description: Earliest closing balance for the bank account.
