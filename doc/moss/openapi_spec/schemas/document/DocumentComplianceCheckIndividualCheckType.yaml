    - BUYER_ADDRESS_PRESENT
    - BUYER_NAME_MATCH
    - BUYER_NAME_PRESENT
    - DELIVERY_DATE_PRESENT
    - DESCRIPTION_PRESENT
    - EXPENSE_DATE_PRESENT
    - EXPENSE_DATE_VALID
    - GROSS_AMOUNT_PRESENT
    - INVOICE_NUMBER_PRESENT
    - NET_AMOUNT_PRESENT
    - REVERSE_CHARGE_APPLIED
    - REVERSE_CHARGE_NOT_APPLIED
    - SUPPLIER_ADDRESS_COMPLETE
    - SUPPLIER_NAME_PRESENT
    - SUPPLIER_VAT_ID_ADDRESS_MATCH
    - SUPPLIER_VAT_ID_EXISTS
    - SUPPLIER_VAT_ID_NAME_MATCH
    - SUPPLIER_VAT_ID_OR_TAX_NUMBER_PRESENT
    - SUPPLIER_VAT_ID_PRESENT
