description: |
  Merchant Category Codes (MCC) for controlling card transactions.

  These are merchant category groups that include multiple individual MCC codes.
  Each group represents a business category such as restaurants, gas stations, etc.

  Examples:
  * `RESTAURANTS`: Includes dining establishments, fast food, cafes
  * `FUEL_GAS`: Includes gas stations and fuel purchases
  * `ENTERTAINMENT`: Includes movies, gaming, concerts
  * `MEDICAL`: Includes hospitals, clinics, pharmacies
  * `AIRLINES_CAR_RENTAL_AND_LODGING`: Includes travel-related expenses
example: RESTAURANTS