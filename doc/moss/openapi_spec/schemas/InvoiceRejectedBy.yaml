type: object
properties:
  rejecterId:
    type: [string, "null"]
    format: uuid
    description: Unique identifier of the user who rejected the invoice
    example: "123e4567-e89b-12d3-a456-426614174000"
  rejectionTime:
    type: [string, "null"]
    format: date-time
    description: When the invoice was rejected
    example: "2023-10-01T10:00:00Z"
description: |
  Information about who rejected the invoice and when.