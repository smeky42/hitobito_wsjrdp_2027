type: object
description: Address of the supplier
properties:
  streetAddress:
    type: string
    description: First line of the street address
    example: "Unter den Linden 1"
  addressLine2:
    type: string
    description: Second line of the street address (apartment, suite, floor, etc.)
    example: "Suite 100"
  city:
    type: string
    description: City
    example: "Berlin"
  postCode:
    type: string
    description: Postal or ZIP code
    example: "10117"
  country:
    type: string
    description: ISO 3166-1 alpha-2 country code (2 uppercase letters)
    minLength: 2
    maxLength: 2
    pattern: '^[A-Z]{2}$'
    x-pattern-message: 'must be a valid ISO 3166-1 alpha-2 country code (2 uppercase letters, e.g. DE, GB, US)'
    example: "DE"
