type: object
description: Fields shared by a general ledger entry and the other entries of its journal.
properties:
  id:
    type: string
    format: uuid
    description: Unique identifier of the general ledger entry.
    example: "1e3b42ec-587d-4fe5-8807-22c0235ee825"
  generalLedgerAccountId:
    type: string
    format: uuid
    description: Unique identifier of the general ledger account.
    example: "3b5d64ae-7a9f-6aa7-aa29-44e2457aa047"
  generalLedgerAccount:
    anyOf:
      - $ref: './ReconciliationGeneralLedgerAccountRef.yaml'
      - type: "null"
    description: General ledger account the entry was posted to, as it was at posting time.
  amount:
    $ref: '../../openapi.yaml#/components/schemas/Money'
    description: Amount of the entry in the account currency. Positive values are debits, negative values are credits.
    example:
      amount: "1000.00"
      currency: "EUR"
required: [id, generalLedgerAccountId, amount]
