# payment_role as Person#build_payment_role derives it from the role in the
# primary group (roles.yml), so that the generated fee columns hold the fee
# of the role from the start; um_a_1 (Group::Unit::Manager) has none.
admin:
  first_name: Chief
  last_name: Admin
  email: admin@wsjrdp.example.com
  contact_data_visible: true
  primary_group: root
  payment_role: RegularPayer::Group::Root::Member

