# The kinds of the credential store (Wsjrdp::Credentials::Kinds,
# doc/wsjrdp/credentials.md). Committed; it holds no secret. A kind is the
# blueprint of a credential: its fields, which of them are secret, the field
# shown as an account's name in lists, and the default lead times of an
# expiry reminder. A further service is a further kind in this file.
#
# Field types: email, string, integer, enum, boolean, url. A field may be
# required, be secret and have a default (a secret one has none); an enum
# lists the values a form suggests (any text is taken; its default is one
# of them). No field may be called name, created_at, valid_from or
# expires_at (reserved for a version's name and dates). Kind and field
# names are lower-case snake of at most 48 characters.

kinds:
  mail_account:
    title_field: mail_from           # shown as the account's name in lists
    fields:
      mail_from:     {type: email, required: true}    # SMTP MAIL FROM
      smtp_host:     {type: string, required: true}
      smtp_port:     {type: integer, default: 587}
      smtp_security: {type: enum, values: [starttls, tls, none], default: starttls}
      smtp_username: {type: string}
      smtp_password: {type: string, secret: true}
      imap_host:     {type: string}
      imap_port:     {type: integer, default: 993}
      imap_username: {type: string}
      imap_password: {type: string, secret: true}
      sent_folder:   {type: string}

  moss_api:
    title_field: client_id
    remind_days_before: [30, 14, 3]
    fields:
      base_url:      {type: url, required: true, default: "https://public-api.getmoss.com"}
      client_id:     {type: string, required: true}
      client_secret: {type: string, required: true, secret: true}
      scope:         {type: enum, values: [read, write], default: read}

  api_key:                           # mailcow, geocoding
    fields:
      base_url: {type: url, required: true}
      api_key:  {type: string, required: true, secret: true}

  basic_auth:                        # helpdesk; Keycloak as the scripts do it
    fields:
      base_url: {type: url, required: true}
      username: {type: string, required: true}
      password: {type: string, required: true, secret: true}
