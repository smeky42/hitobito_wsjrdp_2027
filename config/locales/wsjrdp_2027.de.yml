    errors:
      models:
        person:
          buddy_self: "darf nicht deine eigene Buddy ID sein."
          buddy_no_ul: "muss zu einer Person gehören, die Unit Leader ist."
          buddy_no_yp: "muss zu einer Person gehören, die Youth Participant ist."
        service_token:
          attributes:
            base:
              hmac_key_missing: >-
                Hier (Stage %{stage}) ist kein HMAC-Schlüssel konfiguriert
                (HITOBITO_SERVICE_TOKEN_HMAC_KEYS), deshalb lässt sich kein
                HMAC-Token erzeugen.
              regenerate_kind_refused: Ein Token dieser Art lässt sich für diesen API-Key hier nicht erzeugen.
            layer:
              not_root: "muss die oberste Gruppe sein: API-Keys gibt es nur dort."
            acting_person_id:
              acting_person_missing: gibt es nicht.
              acting_person_not_assignable: darf nur ein Admin setzen oder ändern.
            scopes:
              unknown_scope: "enthält unbekannte Scopes: %{scopes}."
              finance_not_assignable: "für Finanzen darf nur ein Admin setzen oder ändern."
            adopted_stage:
              adopt_stage_format: darf nur a–z und 0–9 enthalten.
              adopt_production: "darf nicht production sein: Produktions-Tokens werden in der Produktion erzeugt."
              adopt_own_stage: "ist diese Umgebung: solche Tokens hier erzeugen."
            adopted_token:
              adopt_format: "muss die Form hmac-sha256:<64 Hex-Zeichen> haben."
            adopted_fingerprint:
              adopt_fingerprint_format: "muss 44 Zeichen Base64 sein (43 Zeichen und =)."
        wsjrdp_document:
          key_blank: darf nicht leer sein.
          key_too_long: darf höchstens 40 Zeichen lang sein.
          key_invalid_characters: muss mit einem Kleinbuchstaben beginnen und darf nur a–z, 0–9 und _ enthalten.
          key_double_separator: darf keinen doppelten Unterstrich (__) enthalten.
          key_trailing_separator: darf nicht auf _ enden.
          attributes:
            base:
              slot_taken: Es gibt schon ein aktuelles Dokument dieser Art; ersetze es stattdessen.
              replaces_not_current: Das Dokument, das ersetzt werden soll, ist nicht mehr aktuell.
              invalid_extension: "Die Dateiendung „%{ext}“ ist ungültig: höchstens 20 Zeichen, nur a–z, 0–9 und Punkte, kein .. und kein Punkt am Ende."
              kind_content_type: "Diese Art von Dokument nimmt nur Dateien vom Typ %{types} an."
              kind_extension: "Diese Art von Dokument nimmt nur Dateien mit der Endung %{extensions} an."
              kind_too_large: "Die Datei ist zu groß (höchstens %{size} MB)."
              empty_file: Die Datei ist leer.
            filename:
              too_long: ist zu lang (höchstens %{max} Bytes)
              invalid_encoding: ungültig (kein UTF-8)
              control_character: ungültig (enthält Unicode-Steuerzeichen)
              forbidden_characters: ungültig (enthält %{characters})
              not_normalized: ist nicht normalisiert
        wsjrdp_document_kind:
          key_blank: darf nicht leer sein.
          key_too_long: darf höchstens 40 Zeichen lang sein.
          key_invalid_characters: muss mit einem Kleinbuchstaben beginnen und darf nur a–z, 0–9 und _ enthalten.
          key_double_separator: darf keinen doppelten Unterstrich (__) enthalten.
          key_trailing_separator: darf nicht auf _ enden.
          invalid_entries: "enthält ungültige Einträge: %{entries}"
          not_a_list: muss eine Liste von Regeln sein.
          invalid_rule: "Regel %{number} ist ungültig (%{problem})."
          invalid_json: ist kein gültiges JSON.
          not_for_subject: gibt es nur für Arten von Personen-Dokumenten.
          unknown_column: ist keine Upload-Spalte der Personen.

